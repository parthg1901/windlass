name: Release

# Pushing a tag v<version> releases that version: the tag, package.json and CHANGELOG.md are
# checked (scripts/release.ts check), every CI job runs, each executable is built and run on its own
# platform, the five npm packages (scripts/npm.ts) are published with trusted publishing (OIDC from
# this workflow, no stored token) and provenance, skipping any already on the registry, and a GitHub
# release is created with the four executables, build-info.json, the install script and SHA256SUMS,
# its notes the version's CHANGELOG.md section.
#
# Run by hand (workflow_dispatch), it is a dry run on that branch: the same jobs, the checks as
# warnings, and the release's files and the five npm tarballs kept as workflow artifacts instead of
# a release; nothing is published. The checklist is docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: Check the tag, version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: The tag is v + the package.json version, and CHANGELOG.md has its section
        id: check
        shell: bash
        run: |
          if [ "$DRY_RUN" = true ]; then bun scripts/release.ts check --dry-run; else bun scripts/release.ts check "$GITHUB_REF_NAME"; fi

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      artifacts: true

  npm:
    name: Publish the npm packages (a dry run keeps the tarballs instead)
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The OIDC token npm's trusted publishing exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: built
      - name: Collect and check the four executables
        run: bun scripts/release.ts assets built release
      # The oldest Node the launcher supports (scripts/npm.ts, NODE_ENGINE), with the npm it comes with.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18.0.0"
      - name: Stage the five packages, check them with npm pack, and pack them
        run: bun scripts/npm.ts stage release --out npm-staged --pack npm-packed
      - name: Install the tarballs as a user would, on the oldest Node, and run the commands
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/npm-global"
          # The main package and this runner's: npm refuses a package for another platform named on its command line.
          # ./ so that an older npm does not read npm-packed/<file> as a GitHub repository.
          platform="$(node -p 'process.platform + "-" + process.arch')"
          main=$(ls ./npm-packed/*.tgz | grep -vE -- '-(linux|darwin)-(x64|arm64)-[^/]*\.tgz$')
          npm install -g --prefix "$prefix" $main ./npm-packed/*-"$platform"-*.tgz
          node --version
          "$prefix/bin/windlass" --version
          "$prefix/bin/wl" --version
          "$prefix/bin/windlass" --demo a-plain-answer --demo-speed 0
          status=0; "$prefix/bin/windlass" --nope 2>/dev/null || status=$?
          [ "$status" = 2 ] || { echo "::error::a usage error exited $status through the launcher, not 2"; exit 1; }
      - name: Keep the tarballs (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ needs.check.outputs.version }}-dry-run
          path: npm-packed/
          if-no-files-found: error
          retention-days: 7
      # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or later.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.DRY_RUN != 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later
        if: env.DRY_RUN != 'true'
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version
      # No NODE_AUTH_TOKEN: npm authenticates with this job's OIDC token through the trusted publisher
      # configured for each package on npmjs.com. --provenance makes a publish fail rather than go out
      # without a provenance statement. The first version is published by hand, before a trusted
      # publisher can exist (docs/releasing.md); a version already on the registry is skipped, so the
      # run goes on to create the GitHub release.
      - name: Publish, the platform packages first, skipping versions already on the registry
        if: env.DRY_RUN != 'true'
        run: bun scripts/npm.ts publish release --out npm-staged --provenance

  release:
    name: Create the GitHub release (a dry run keeps its files instead)
    needs: [check, ci, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creating the release. Nothing else in this workflow can write.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: The same checks, in the job that releases, writing the release notes
        id: check
        shell: bash
        run: |
          if [ "$DRY_RUN" = true ]; then bun scripts/release.ts check --dry-run --notes release-notes.md; else bun scripts/release.ts check "$GITHUB_REF_NAME" --notes release-notes.md; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: built
      - name: Collect the executables, build-info.json, the install script and SHA256SUMS
        run: bun scripts/release.ts assets built release
      - name: Verify the checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Keep the files (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.check.outputs.version }}-dry-run
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file release-notes.md release/*
